apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: aurekai-proof-bundle-export-
  labels:
    aurekai.io/template: "proof-bundle-export"
spec:
  entrypoint: run
  templates:
    - name: run
      container:
        image: ghcr.io/aurekai/aurekai:0.8.0-alpha.4
        command: ["/bin/sh", "-c"]
        args: ["akai proof export --output /tmp/proof.tar.gz"]
