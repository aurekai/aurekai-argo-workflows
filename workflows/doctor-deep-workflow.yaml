apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: aurekai-doctor-deep-
  labels:
    aurekai.io/template: "doctor-deep"
spec:
  entrypoint: run
  templates:
    - name: run
      container:
        image: ghcr.io/aurekai/aurekai:0.8.0-alpha.4
        command: ["/bin/sh", "-c"]
        args: ["akai doctor --deep --json"]
