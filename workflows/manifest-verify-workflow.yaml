apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: aurekai-manifest-verify-
  labels:
    aurekai.io/template: "manifest-verify"
spec:
  entrypoint: run
  templates:
    - name: run
      container:
        image: ghcr.io/aurekai/aurekai:0.8.0-alpha.4
        command: ["/bin/sh", "-c"]
        args: ["akai verify --manifest artifact.json --json"]
