apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: aurekai-sae-audit-
  labels:
    aurekai.io/template: "sae-audit"
spec:
  entrypoint: run
  templates:
    - name: run
      container:
        image: ghcr.io/aurekai/aurekai:0.8.0-alpha.4
        command: ["/bin/sh", "-c"]
        args: ["akai sae audit --model default --json"]
