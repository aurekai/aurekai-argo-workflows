apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: aurekai-model-memory-pack-
  labels:
    aurekai.io/template: "model-memory-pack"
spec:
  entrypoint: run
  templates:
    - name: run
      container:
        image: ghcr.io/aurekai/aurekai:0.8.0-alpha.4
        command: ["/bin/sh", "-c"]
        args: ["akai pack --tag latest --json"]
